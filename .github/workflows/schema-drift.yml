name: Schema drift

# Phase 90 (ADR 0066): is the live database still what supabase/migrations/
# builds? Weekly, and by hand from the Actions tab. The job replays every
# migration in PGlite, connects to the live project as schema_drift_reader
# (supabase/ops/20261005_phase90_schema_drift_reader.sql: catalogs and the
# migration history only, read-only), and fails when anything differs:
#   exit 1  drift, an unrecorded migration included;
#   exit 2  not checked (no secret, no connection, or a credential that can
#           read app data). Never reported as "no drift".
# The result is the job's summary. The repository is public, so the summary
# and the log are too: they name schema objects, never a row of data, and the
# connection string is a secret GitHub masks.
on:
  schedule:
    # Mondays 02:17 UTC, 09:17 in Bangkok. Off the hour, when GitHub's
    # scheduler is least busy.
    - cron: '17 2 * * 1'
  workflow_dispatch:

# Phase 91 (ADR 0067): nothing by default; the job reads the repository and
# nothing else. Every action is pinned to a commit, its release in the comment.
permissions: {}

concurrency:
  group: schema-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Compare live with the migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes, so the job's token is not left in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      # --live: without the secret this exits 2, never 0.
      - name: Replay the migrations and compare live
        env:
          SUPABASE_DRIFT_DB_URL: ${{ secrets.SUPABASE_DRIFT_DB_URL }}
          SUPABASE_DRIFT_DB_CA: ${{ secrets.SUPABASE_DRIFT_DB_CA }}
        run: npm run schema:drift -- --live
