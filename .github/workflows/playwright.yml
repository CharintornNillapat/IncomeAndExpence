name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
    # A docs-only push (an ADR, the audit logs, a sha backfill) cannot change
    # what the suites test. If branch protection ever makes this check
    # required, a docs-only PR would wait on it forever: drop the filter then.
    paths-ignore: [ 'docs/**', 'anti-slop/**', '**/*.md' ]
  pull_request:
    branches: [ main, master ]
    paths-ignore: [ 'docs/**', 'anti-slop/**', '**/*.md' ]

# A newer push to the same ref tests a superset of the same code, so the older
# run is cancelled rather than left to finish (Phase 55, T201).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Phase 91 (ADR 0067): no job's token can do anything it was not given below,
# and each job is given only `contents: read`, for the checkout. Artifacts and
# the npm cache go through the run's own runtime token, not this one. Every
# action is pinned to a commit, its release in the comment.
permissions: {}

jobs:
  checks:
    name: Type-check and unit tests
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes, so the job's token is not left in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      # Its own job, and every browser job `needs` it (ADR 0021): the unit
      # suite runs in seconds, so a failure here stops the run before any
      # browser is downloaded. It reaches the logic Playwright structurally
      # cannot - the isSecureContext branch, the retry clock, the threshold
      # boundaries and the ledger guards' ordering.
      - name: Unit tests (Vitest)
        run: npm run test:unit

      # Phase 120 (ADR 0096): the same suite again, its files and the tests in
      # each in a random order. Phase 118's bug passed the pull request on
      # timing and failed on `main`; a test that leans on order or timing is
      # likelier to fail here, before the merge. The log prints the seed:
      # `npx vitest run --sequence.shuffle --sequence.seed=<seed>` replays it.
      - name: Unit tests, shuffled (Vitest)
        run: npm run test:unit:shuffle

  e2e:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: checks
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Two jobs per browser, run side by side (Phase 55, T199; sharded in Phase
    # 85, ADR 0061). fail-fast is off so a failure in one engine still reports
    # the other two.
    strategy:
      fail-fast: false
      matrix:
        project: [ chromium, firefox, webkit ]
        # Each shard runs half of the browser's tests on its own runner, still
        # with 2 workers. A job's time follows the machine it lands on (AMD
        # EPYC 7763 runners took about 1.3 times as long as EPYC 9V45 ones),
        # so halving each job halves that swing too. Measured over three runs
        # each: end to end 233 to 242 s, against 320 to 362 s unsharded; 3
        # workers unsharded saved only 7 to 13% and made every test about a
        # third slower.
        shard: [ 1, 2 ]
        # The one place the container's Playwright version is written. It must
        # equal the version package-lock.json installs: the image carries the
        # browsers for that release only (checked below).
        playwright: [ '1.63.0' ]
    # Playwright's image ships the three browsers and every OS package they
    # need, so no job runs apt (ADR 0044): install-deps took a median 23 s but
    # up to 19 min on a slow Ubuntu mirror. --user 1001 is the runner's own
    # user, as Playwright's CI guide does: the checkout stays writable and
    # $HOME belongs to whoever runs Firefox, which refuses a $HOME owned by
    # someone else.
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes, so the job's token is not left in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      # A lockfile bump without a new image would fail every test with a
      # missing browser executable; this names the cause instead.
      - name: Check the image matches the installed Playwright
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "${{ matrix.playwright }}" ]; then
            echo "::error::package-lock.json installs Playwright $installed, but the container is v${{ matrix.playwright }}. Change matrix.playwright in this file to $installed."
            exit 1
          fi

      # Phase 85 (ADR 0061): a job's test time follows the machine it lands
      # on. Over 20 runs a slow runner took about 1.3 times as long in WebKit,
      # evenly across every test, so a slow job is read against this line
      # before anything is blamed on the suite.
      - name: Describe the runner
        run: |
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')
          mem=$(awk '/MemTotal/ { printf "%.1f GiB", $2 / 1048576 }' /proc/meminfo)
          echo "Runner: $(nproc) CPUs, $cpu, $mem"
          echo "Runner: $(nproc) CPUs, $cpu, $mem" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Playwright E2E tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          CI: true
          # One blob per browser and shard, so the six never share a name
          # when the merge job downloads them into one folder (ADR 0062).
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}.zip

      # The raw results and attachments (traces included) for the merge job
      # below. Not a report to read: the merged one is. Kept a week, so a
      # failed merge can still be redone by hand with
      # `npx playwright merge-reports --reporter html <folder of the zips>`.
      - name: Upload the blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  # Phase 86 (ADR 0062): one HTML report for all six shards, with every kept
  # trace in it, instead of six reports to search. It runs whether the tests
  # passed or failed (a failure is when the report is needed), but not on a
  # run a newer push cancelled, and not when `checks` failed and no shard ran.
  # It only reports: a failed test already fails its own E2E job.
  merge-reports:
    name: Merge the E2E reports
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes, so the job's token is not left in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: 'npm'

      # merge-reports must be the Playwright version that wrote the blobs,
      # which is the lockfile's. No browser is needed.
      - name: Install project dependencies
        run: npm ci

      - name: Download the blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # The JSON goes in the report folder, so the artifact carries every
      # result in a form a script can read as well as the page to browse.
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

      - name: Summarise each browser
        run: node scripts/ci-report-summary.mjs playwright-report/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-unified
          path: playwright-report/
          retention-days: 30
