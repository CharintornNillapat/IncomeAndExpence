name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      # Placed BEFORE the browser install on purpose (ADR 0021): the unit
      # suite runs in seconds, so a failure here aborts the job without ever
      # downloading three browsers. It reaches the logic Playwright
      # structurally cannot - the isSecureContext branch, the retry clock,
      # the threshold boundaries and the ledger guards' ordering.
      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Install Playwright browsers with OS dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
