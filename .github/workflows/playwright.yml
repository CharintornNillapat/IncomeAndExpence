name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
    # A docs-only push (an ADR, the audit logs, a sha backfill) cannot change
    # what the suites test. If branch protection ever makes this check
    # required, a docs-only PR would wait on it forever: drop the filter then.
    paths-ignore: [ 'docs/**', 'anti-slop/**', '**/*.md' ]
  pull_request:
    branches: [ main, master ]
    paths-ignore: [ 'docs/**', 'anti-slop/**', '**/*.md' ]

# A newer push to the same ref tests a superset of the same code, so the older
# run is cancelled rather than left to finish (Phase 55, T201).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check and unit tests
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      # Its own job, and every browser job `needs` it (ADR 0021): the unit
      # suite runs in seconds, so a failure here stops the run before any
      # browser is downloaded. It reaches the logic Playwright structurally
      # cannot - the isSecureContext branch, the retry clock, the threshold
      # boundaries and the ledger guards' ordering.
      - name: Unit tests (Vitest)
        run: npm run test:unit

  e2e:
    name: E2E (${{ matrix.project }})
    needs: checks
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # One job per browser, run side by side (Phase 55, T199). fail-fast is off
    # so a failure in one engine still reports the other two.
    strategy:
      fail-fast: false
      matrix:
        project: [ chromium, firefox, webkit ]
        # The one place the container's Playwright version is written. It must
        # equal the version package-lock.json installs: the image carries the
        # browsers for that release only (checked below).
        playwright: [ '1.63.0' ]
    # Playwright's image ships the three browsers and every OS package they
    # need, so no job runs apt (ADR 0044): install-deps took a median 23 s but
    # up to 19 min on a slow Ubuntu mirror. --user 1001 is the runner's own
    # user, as Playwright's CI guide does: the checkout stays writable and
    # $HOME belongs to whoever runs Firefox, which refuses a $HOME owned by
    # someone else.
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      # A lockfile bump without a new image would fail every test with a
      # missing browser executable; this names the cause instead.
      - name: Check the image matches the installed Playwright
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "${{ matrix.playwright }}" ]; then
            echo "::error::package-lock.json installs Playwright $installed, but the container is v${{ matrix.playwright }}. Change matrix.playwright in this file to $installed."
            exit 1
          fi

      # Phase 85 (ADR 0061): a job's test time follows the machine it lands
      # on. Over 20 runs a slow runner took about 1.3 times as long in WebKit,
      # evenly across every test, so a slow job is read against this line
      # before anything is blamed on the suite.
      - name: Describe the runner
        run: |
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')
          mem=$(awk '/MemTotal/ { printf "%.1f GiB", $2 / 1048576 }' /proc/meminfo)
          echo "Runner: $(nproc) CPUs, $cpu, $mem"
          echo "Runner: $(nproc) CPUs, $cpu, $mem" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Playwright E2E tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
